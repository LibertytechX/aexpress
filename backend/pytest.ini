[pytest]
DJANGO_SETTINGS_MODULE = ax_merchant_api.settings_test
testpaths = authentication ax_merchant_api bot chats crons devs dispatcher operations oprtn_dashboard orders referrals riders subscriptions wallet webhooks whatsapp_messaging
python_files = tests.py test_*.py *_tests.py *_test.py
python_classes = Test* *Test *TestCase
python_functions = test_*
norecursedirs = scratch .git venv .venv staticfiles logs deploy data
addopts =
    --strict-markers
    -p no:warnings
    --reuse-db
    --no-migrations
    --tb=short
    --timeout=60

filterwarnings =
    ignore::DeprecationWarning:kombu
    ignore::DeprecationWarning:celery
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:coreapi

markers =
    unit: no DB access, pure Python logic
    integration: requires database access
    api: tests DRF views end-to-end
    celery: tests Celery task logic
    slow: takes more than 2 seconds
    external: calls real external APIs — skip in CI

[coverage:run]
omit =
    */migrations/*
    */tests/*
    */test_*.py
    */management/*
    conftest.py
    manage.py
    ax_merchant_api/wsgi.py
    ax_merchant_api/asgi.py
    */factories.py
    */factories/*
    test_utils/*
    scratch/*
    deploy/*

[coverage:report]
fail_under = 80
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    def __repr__
    raise NotImplementedError
