version: 2.1

jobs:
  test:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Create .env from secret
          command: echo "$ENV_FILE" | base64 --decode > .env.test
      - run:
          name: Run tests
          command: ./test.sh
          no_output_timeout: 10m

workflows:
  test-on-pr:
    jobs:
      - test
